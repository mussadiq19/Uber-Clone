spring:
  application:
    name: UberApiGateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: auth-service
              uri: lb://UBERPROJECT-AUTHSERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: booking-service
              uri: lb://UBERBOOKINGSERVICE
              predicates:
                - Path=/api/v1/booking/**
            - id: location-service
              uri: lb://UBERPROJECT-LOCATIONSERVICE
              predicates:
                - Path=/api/location/**
            - id: socket-service
              uri: lb://UBERSOCKERSERVICE
              predicates:
                - Path=/api/socket/**
            - id: socket-service-ws
              uri: lb:ws://UBERSOCKERSERVICE
              predicates:
                - Path=/ws/**

server:
  port: 6969

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true